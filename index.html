<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LowBid Ethiopia</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#F8FAFC;color:#0f172a}.card{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}</style>
</head>
<body class="min-h-screen pb-16">
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
 <div class="max-w-5xl mx-auto px-3 py-2 flex items-center gap-2">
  <div class="font-extrabold text-lg text-emerald-600">Low<span class="text-slate-900">Bid</span></div>
  <span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-300" title="live"></span>
  <div class="flex-1"></div>
  <button id="phone" class="hidden sm:block text-xs bg-slate-100 rounded-full px-3 py-1.5"></button>
  <div id="bal" class="text-sm font-bold bg-emerald-50 text-emerald-700 rounded-full px-3 py-1.5">ETB —</div>
  <button id="topup" class="text-sm font-semibold bg-emerald-600 text-white rounded-full px-3 py-1.5">+ Top Up</button>
 </div>
</header>
<main class="max-w-5xl mx-auto px-3">
 <div class="flex gap-2 my-4" id="pills"></div>
 <section id="secRooms" class="mb-8 rounded-3xl p-3 bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200">
  <h2 class="font-bold text-lg mb-3 flex items-center gap-2">⚡ Special Bidding Rooms <span class="text-[10px] bg-amber-400 text-amber-950 rounded-full px-2 py-0.5">LIMITED SLOTS</span></h2>
  <div id="rooms" class="grid gap-3 md:grid-cols-2"></div><p id="roomsEmpty" class="text-sm text-slate-500 hidden">No rooms right now.</p>
 </section>
 <section id="secItems" class="mb-8">
  <h2 class="font-bold text-lg mb-3">🛍️ Open Bidded Items</h2>
  <div id="items" class="grid gap-3 md:grid-cols-2"></div><p id="itemsEmpty" class="text-sm text-slate-500 hidden">No items right now.</p>
 </section>
</main>
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center p-3"><div id="mbox" class="bg-white rounded-3xl p-5 w-full max-w-sm"></div></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full text-sm text-white"></div>
<script>
const $=s=>document.querySelector(s);
let token=localStorage.getItem("t")||"",me=null,filter="all",cards={},data=[],cfg={};
const ST={leading:["bg-emerald-500 text-white","🟢 You're leading"],unique:["bg-blue-500 text-white","🔵 Unique, not lowest"],duplicated:["bg-amber-400 text-amber-950","🟡 Duplicated, bid again!"],closed:["bg-red-500 text-white","🔴 Closed"]};
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-sm text-white "+(bad?"bg-red-600":"bg-slate-900");setTimeout(()=>t.classList.add("hidden"),3500)}
async function api(p,o={}){const h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;
 const r=await fetch(p,{...o,headers:h});const d=await r.json().catch(()=>({}));
 if(r.status===401&&token){token="";localStorage.removeItem("t");me=null;paintMe()}
 if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Something went wrong");return d}
const etb=n=>"ETB "+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
function modal(html){$("#mbox").innerHTML=html;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function paintMe(){$("#bal").textContent=me?etb(me.wallet_balance):"ETB —";const p=$("#phone");p.textContent=me?me.phone_number:"Log in";p.classList.remove("hidden");p.onclick=me?()=>{if(confirm("Log out?")){token="";localStorage.removeItem("t");me=null;paintMe();sync()}}:loginModal}
function loginModal(){modal(`<h3 class="font-bold text-lg mb-3">Log in</h3>
 <input id="ph" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="+2519XXXXXXXX" value="+251">
 <div id="otpBox" class="hidden"><input id="otp" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="6-digit code" maxlength="6"></div>
 <button id="go" class="w-full bg-emerald-600 text-white rounded-xl py-2 font-semibold">Send code</button>`);
 let sent=false;$("#go").onclick=async()=>{try{
  if(!sent){await api("/api/auth/send-otp",{method:"POST",body:JSON.stringify({phone_number:$("#ph").value.trim()})});sent=true;$("#otpBox").classList.remove("hidden");$("#go").textContent="Verify & continue"}
  else{const d=await api("/api/auth/verify-otp",{method:"POST",body:JSON.stringify({phone_number:$("#ph").value.trim(),code:$("#otp").value.trim()})});token=d.token;localStorage.setItem("t",token);closeModal();await sync()}
 }catch(e){toast(e.message,1)}}}
$("#topup").onclick=()=>{if(!token)return loginModal();
 modal(`<h3 class="font-bold text-lg mb-3">Top up wallet</h3>
 <div class="grid grid-cols-4 gap-2 mb-2">${[50,100,200,500].map(v=>`<button class="pre border rounded-xl py-2 text-sm" data-v="${v}">${v}</button>`).join("")}</div>
 <input id="amt" type="number" min="10" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="Amount in ETB" value="100">
 <select id="prov" class="w-full border rounded-xl px-3 py-2 mb-3"><option value="chapa">Chapa</option><option value="telebirr">Telebirr</option><option value="cbe">CBE Birr</option></select>
 <button id="pay" class="w-full bg-emerald-600 text-white rounded-xl py-2 font-semibold">Continue</button>`);
 document.querySelectorAll(".pre").forEach(b=>b.onclick=()=>$("#amt").value=b.dataset.v);
 $("#pay").onclick=async()=>{const body=JSON.stringify({amount:$("#amt").value,provider:$("#prov").value});try{
  if(cfg.dev_mode){me=await api("/api/wallet/deposit",{method:"POST",body});paintMe();closeModal();toast("Wallet topped up (dev mode)")}
  else{const d=await api("/api/wallet/deposit/initiate",{method:"POST",body});window.open(d.checkout_url,"_blank");closeModal();pollDeposit(d.tx_ref)}
 }catch(e){toast(e.message,1)}}};
async function pollDeposit(ref,n=0){if(n>60)return;try{const d=await api("/api/wallet/deposit/status/"+ref);
 if(d.status==="confirmed"){toast("Deposit confirmed ✔");return sync()}if(d.status==="failed")return toast("Deposit failed",1)}catch(e){}setTimeout(()=>pollDeposit(ref,n+1),4000)}
function pills(){$("#pills").innerHTML=[["all","All"],["rooms","⚡ Special Rooms"],["items","🛍️ Bidded Items"]].map(([k,l])=>`<button data-k="${k}" class="px-4 py-1.5 rounded-full text-sm font-semibold border ${filter===k?"bg-emerald-600 text-white border-emerald-600":"bg-white border-slate-200"}">${l}</button>`).join("");
 document.querySelectorAll("#pills button").forEach(b=>b.onclick=()=>{filter=b.dataset.k;pills();applyFilter()});}
function applyFilter(){$("#secRooms").classList.toggle("hidden",filter==="items");$("#secItems").classList.toggle("hidden",filter==="rooms")}
function mkCard(a){
 const el=document.createElement("div");el.className="card bg-white rounded-2xl border border-slate-200 p-4 shadow-sm";
 const st={tab:"single",pack:10,mode:"consec",n:1};el.st=st;
 el.innerHTML=`<div class="flex justify-between gap-2"><div><div class="font-bold" data-k="title"></div><div class="text-xs text-slate-500" data-k="desc"></div></div><div data-k="badge" class="text-[11px] h-fit rounded-full px-2 py-1 font-semibold whitespace-nowrap hidden"></div></div>
 <div class="text-sm mt-2"><span class="line-through text-slate-400" data-k="val"></span> <span class="font-semibold text-emerald-700" data-k="fee"></span> / bid</div>
 <div data-k="cap" class="mt-2"></div>
 <div class="text-xs text-slate-600 mt-1 flex justify-between"><span data-k="bids"></span><span data-k="timer" class="font-mono font-semibold"></span></div>
 <div data-k="ctl" class="mt-3">
  <div class="flex bg-slate-100 rounded-xl p-1 text-sm mb-2"><button data-t="single" class="tab flex-1 rounded-lg py-1">Single Bid</button><button data-t="pack" class="tab flex-1 rounded-lg py-1">Multi-Bid Pack</button></div>
  <div data-p="single" class="flex gap-2"><button class="dec w-10 rounded-xl bg-slate-100 font-bold">−</button><input type="number" min="1" value="1" class="num flex-1 text-center border rounded-xl py-2"><button class="inc w-10 rounded-xl bg-slate-100 font-bold">+</button><button class="place bg-emerald-600 text-white rounded-xl px-4 font-semibold">Place Bid</button></div>
  <div data-p="pack" class="hidden space-y-2">
   <div class="grid grid-cols-3 gap-2">${[10,50,100].map(n=>`<button data-n="${n}" class="pk border rounded-xl py-1.5 text-sm">${n} Bids</button>`).join("")}</div>
   <div class="flex gap-2 text-sm"><button data-m="consec" class="md flex-1 border rounded-xl py-1.5">Consecutive</button><button data-m="random" class="md flex-1 border rounded-xl py-1.5">Random Unique</button></div>
   <div data-k="startRow" class="flex items-center gap-2 text-sm">Start at <input type="number" min="1" value="1" class="start w-24 border rounded-xl px-2 py-1 text-center"></div>
   <div class="text-sm">Total: <b data-k="total"></b></div>
   <button class="buy w-full bg-emerald-600 text-white rounded-xl py-2 font-semibold">Buy &amp; Place Pack</button></div>
 </div>
 <div data-k="mine" class="mt-3 hidden"><button class="tgl text-xs font-semibold text-slate-600">▸ My Bids</button><div class="list hidden flex flex-wrap gap-1 mt-2"></div></div>`;
 const q=s=>el.querySelector(s),qa=s=>el.querySelectorAll(s);
 const mode=()=>{qa(".tab").forEach(b=>b.className="tab flex-1 rounded-lg py-1 "+(b.dataset.t===st.tab?"bg-white shadow font-semibold":""));
  q('[data-p="single"]').classList.toggle("hidden",st.tab!=="single");q('[data-p="pack"]').classList.toggle("hidden",st.tab!=="pack");
  qa(".pk").forEach(b=>b.className="pk border rounded-xl py-1.5 text-sm "+(+b.dataset.n===st.pack?"bg-emerald-600 text-white border-emerald-600":""));
  qa(".md").forEach(b=>b.className="md flex-1 border rounded-xl py-1.5 "+(b.dataset.m===st.mode?"bg-emerald-600 text-white border-emerald-600":""));
  q('[data-k="startRow"]').classList.toggle("hidden",st.mode!=="consec");
  q('[data-k="total"]').textContent=etb(st.pack*(el.a?.bid_fee||0))};
 el.refreshMode=mode;
 qa(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;mode()});
 qa(".pk").forEach(b=>b.onclick=()=>{st.pack=+b.dataset.n;mode()});
 qa(".md").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;mode()});
 q(".dec").onclick=()=>{const i=q(".num");i.value=Math.max(1,(+i.value||1)-1)};
 q(".inc").onclick=()=>{const i=q(".num");i.value=(+i.value||0)+1};
 q(".tgl").onclick=()=>{const l=q(".list");l.classList.toggle("hidden");q(".tgl").textContent=(l.classList.contains("hidden")?"▸":"▾")+" My Bids"};
 const send=async(amts,btn)=>{if(!token)return loginModal();btn.disabled=true;try{
   const d=await api(`/api/auctions/${el.a.id}/bid-batch`,{method:"POST",body:JSON.stringify({bid_amounts:amts})});
   toast(`Placed ${d.placed} bid${d.placed>1?"s":""} ✔`);if(me){me.wallet_balance=d.wallet_balance;paintMe()}await sync()}
  catch(e){toast(e.message,1)}btn.disabled=false};
 q(".place").onclick=e=>{const v=Math.floor(+q(".num").value);if(!(v>=1))return toast("Enter a positive whole number",1);send([v],e.target)};
 q(".buy").onclick=e=>{const n=st.pack;let amts=[];
  if(st.mode==="consec"){const s=Math.max(1,Math.floor(+q(".start").value||1));for(let i=0;i<n;i++)amts.push(s+i)}
  else{const taken=new Set((el.a.user_bids||[]).map(b=>b.amount));const range=Math.max(n*10,200);const set=new Set();let g=0;
   while(set.size<n&&g++<100000){const x=1+Math.floor(Math.random()*range);if(!set.has(x)&&!taken.has(x))set.add(x)}amts=[...set]}
  send(amts,e.target)};
 mode();return el}
function upd(el,a){el.a=a;const q=s=>el.querySelector(`[data-k="${s}"]`);
 q("title").textContent=a.title;q("desc").textContent=a.description||"";q("val").textContent=etb(a.market_value);q("fee").textContent=etb(a.bid_fee);
 const left=Math.max(0,a.max_slots-a.filled_slots),pct=Math.min(100,a.filled_slots/a.max_slots*100);
 q("cap").innerHTML=a.is_room?`<div class="flex justify-between text-xs font-semibold"><span>Room Capacity</span><span class="${left<=10?"text-red-600 animate-pulse":"text-emerald-700"}">${left} Slots Left</span></div><div class="h-2 bg-slate-100 rounded-full mt-1 overflow-hidden"><div class="h-full ${pct>80?"bg-red-500":"bg-emerald-500"} transition-all" style="width:${pct}%"></div></div><div class="text-[11px] text-slate-500 mt-0.5">${a.filled_slots} / ${a.max_slots} filled</div>`:"";
 q("bids").textContent=a.is_room?"":`${a.filled_slots.toLocaleString()} bids cast`;
 el.ends=a.ends_at?new Date(a.ends_at).getTime():null;
 const b=q("badge"),s=ST[a.user_status];b.classList.toggle("hidden",!s);if(s){b.className="text-[11px] h-fit rounded-full px-2 py-1 font-semibold whitespace-nowrap "+s[0];b.textContent=s[1]}
 if(a.won){b.className="text-[11px] h-fit rounded-full px-2 py-1 font-semibold bg-yellow-400 text-yellow-950";b.textContent="🏆 You won!"}
 const live=a.status==="active";q("ctl").classList.toggle("hidden",!live);
 const m=q("mine");m.classList.toggle("hidden",!a.user_bids.length);
 el.querySelector(".list").innerHTML=a.user_bids.map(x=>`<span class="text-xs px-2 py-0.5 rounded-full ${x.unique?"bg-blue-100 text-blue-800":"bg-amber-100 text-amber-800"}" title="${x.unique?"unique":"duplicated"}">${x.amount}${x.unique?" ✓":" ✗"}</span>`).join("");
 el.refreshMode();tick(el)}
function tick(el){const t=el.querySelector('[data-k="timer"]');if(!el.a)return;if(el.a.status!=="active"){t.textContent="Ended";return}
 if(!el.ends){t.textContent="";return}let s=Math.max(0,Math.floor((el.ends-Date.now())/1000));
 const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);t.textContent=(d?d+"d ":"")+[h,m,s%60].map(x=>String(x).padStart(2,"0")).join(":")}
setInterval(()=>Object.values(cards).forEach(tick),1000);
function render(list){const seen=new Set();
 list.forEach(a=>{seen.add(a.id);let el=cards[a.id];if(!el){el=cards[a.id]=mkCard(a)}
  const host=a.is_room?$("#rooms"):$("#items");if(el.parentNode!==host)host.appendChild(el);upd(el,a)});
 Object.keys(cards).forEach(id=>{if(!seen.has(+id)){cards[id].remove();delete cards[id]}});
 $("#roomsEmpty").classList.toggle("hidden",list.some(a=>a.is_room));$("#itemsEmpty").classList.toggle("hidden",list.some(a=>!a.is_room))}
async function sync(){try{const [a,m]=await Promise.all([api("/api/auctions"),token?api("/api/me").catch(()=>null):null]);data=a;if(m)me=m;paintMe();render(a)}catch(e){}}
let ws,wsTimer;function connect(){const p=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(`${p}://${location.host}/ws`);
 ws.onopen=()=>{$("#dot").className="w-2.5 h-2.5 rounded-full bg-emerald-500";setInterval(()=>ws.readyState===1&&ws.send("ping"),25000)};
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="slots"&&cards[m.auction_id]&&cards[m.auction_id].a){cards[m.auction_id].a.filled_slots=m.filled_slots;upd(cards[m.auction_id],cards[m.auction_id].a)}
  if(m.type==="closed"||m.type==="slots")sync()};
 ws.onclose=()=>{$("#dot").className="w-2.5 h-2.5 rounded-full bg-slate-300";clearTimeout(wsTimer);wsTimer=setTimeout(connect,2000)};ws.onerror=()=>ws.close()}
(async()=>{pills();applyFilter();try{cfg=await api("/api/payments/config")}catch(e){}paintMe();await sync();connect();setInterval(sync,5000)})();
</script></body></html>
