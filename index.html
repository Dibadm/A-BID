<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A BID Ethiopia</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#F8FAFC;color:#0f172a}
  .card{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .overflow-x-hidden{overflow-x:hidden}
  .input-base{font-size:16px !important}
  .touch-target{min-height:44px}
  .pill-scroll{scrollbar-width:none;-ms-overflow-style:none}
  .pill-scroll::-webkit-scrollbar{display:none}
  .img-fallback{background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);display:flex;align-items:center;justify-content:center;color:#166534}
  .sheet-enter{animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  .method-btn{border:2px solid #e2e8f0;transition:all .15s}
  .method-btn.active{border-color:#10b981;background:#f0fdf4}
  .method-btn.disabled{opacity:.5;pointer-events:none}
  .method-btn:not(.disabled):hover{border-color:#94a3b8}
  .bid-status{display:inline-flex;align-items:center;gap:1px;padding:1px 6px;border-radius:9999px;font-size:10px;font-weight:600}
</style>
</head>
<body class="min-h-screen pb-20 overflow-x-hidden">
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-3 py-2 flex items-center gap-2 flex-wrap">
    <div class="font-extrabold text-lg text-emerald-600 flex items-center gap-1">
      A<span class="text-slate-900"> BID</span>
    </div>
    <span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-300 shrink-0" title="live" aria-label="Connection status"></span>
    <div class="flex-1 min-w-0"></div>
    <button id="phone" class="text-xs sm:text-sm bg-slate-100 text-slate-700 rounded-full px-3 py-1.5 touch-target whitespace-nowrap shrink-0" aria-label="Account"></button>
    <div id="bal" class="text-sm font-bold bg-emerald-50 text-emerald-700 rounded-full px-3 py-1.5 touch-target shrink-0 whitespace-nowrap">ETB —</div>
    <button id="topup" class="text-sm font-semibold bg-emerald-600 text-white rounded-full px-3 py-1.5 touch-target shrink-0 whitespace-nowrap">+ Top Up</button>
  </div>
</header>
<main class="max-w-5xl mx-auto px-3 pb-4">
  <!-- How It Works Strip -->
  <section class="mb-4" aria-label="How it works">
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white rounded-xl p-3 border border-slate-200 touch-target">
        <div class="w-8 h-8 mx-auto mb-1.5 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold text-sm">1</div>
        <div class="text-xs font-medium text-slate-700">Deposit</div>
        <div class="text-[10px] text-slate-500">Add ETB via Chapa/Telebirr/CBE</div>
      </div>
      <div class="bg-white rounded-xl p-3 border border-slate-200 touch-target">
        <div class="w-8 h-8 mx-auto mb-1.5 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm">2</div>
        <div class="text-xs font-medium text-slate-700">Bid</div>
        <div class="text-[10px] text-slate-500">Place unique bids on items</div>
      </div>
      <div class="bg-white rounded-xl p-3 border border-slate-200 touch-target">
        <div class="w-8 h-8 mx-auto mb-1.5 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 font-bold text-sm">3</div>
        <div class="text-xs font-medium text-slate-700">Win</div>
        <div class="text-[10px] text-slate-500">Lowest unique bid wins</div>
      </div>
    </div>
  </section>

  <!-- Filter Pills -->
  <div class="flex gap-2 my-4 pill-scroll overflow-x-auto pb-2" id="pills" role="tablist" aria-label="Filter auctions"></div>

  <!-- Flash Rooms Section -->
  <section id="secRooms" class="mb-6 rounded-2xl p-3 bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200" aria-labelledby="rooms-heading">
    <h2 id="rooms-heading" class="font-bold text-lg mb-3 flex items-center gap-2">⚡ FLASH ROOMS <span class="text-[10px] bg-amber-400 text-amber-950 rounded-full px-2 py-0.5">LIMITED SLOTS</span></h2>
    <div id="rooms" class="grid gap-3 sm:grid-cols-2"></div>
    <p id="roomsEmpty" class="text-sm text-slate-500 text-center py-4 hidden">No flash rooms right now.</p>
  </section>

  <!-- Bidded Items Section -->
  <section id="secItems" class="mb-6" aria-labelledby="items-heading">
    <h2 id="items-heading" class="font-bold text-lg mb-3">🛍️ BIDDED ITEMS</h2>
    <div id="items" class="grid gap-3 sm:grid-cols-2"></div>
    <p id="itemsEmpty" class="text-sm text-slate-500 text-center py-4 hidden">No items right now.</p>
  </section>
</main>

<!-- Modal (reused for login, topup, checkout) -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-3" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="mbox" class="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto"></div>
</div>

<!-- Checkout Sheet (bottom sheet on mobile, centered modal on desktop) -->
<div id="checkoutSheet" class="hidden fixed inset-0 z-50" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
  <div class="fixed inset-0 bg-black/50" onclick="closeCheckout()"></div>
  <div class="fixed bottom-0 left-0 right-0 sm:max-w-md sm:mx-auto sm:rounded-t-2xl sm:rounded-b-none sm:bottom-auto sm:top-1/2 sm:-translate-y-1/2 z-50 bg-white sheet-enter max-h-[90vh] flex flex-col" style="border-radius:1.5rem 1.5rem 0 0;">
    <div class="sticky top-0 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0">
      <h3 id="checkout-title" class="font-bold text-lg">Checkout</h3>
      <button onclick="closeCheckout()" class="text-slate-500 hover:text-slate-700 text-2xl leading-none p-1">×</button>
    </div>
    <div id="checkoutBody" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    <div class="sticky bottom-0 bg-white/95 backdrop-blur border-t border-slate-200 px-4 py-3 shrink-0 safe-area-bottom">
      <button id="checkoutPayBtn" class="w-full bg-emerald-600 text-white rounded-xl py-3 font-semibold touch-target disabled:opacity-50 disabled:cursor-not-allowed" disabled>Pay & Place Bid</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-60 hidden px-4 py-2 rounded-full text-sm text-white"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
let token=localStorage.getItem("t")||"", me=null, filter="all", cards={}, data=[], cfg={};

const ST={
  leading:["bg-emerald-500 text-white","🟢 Leading"],
  unique:["bg-blue-500 text-white","🔵 Unique"],
  duplicated:["bg-amber-400 text-amber-950","🟡 Duplicated"],
  closed:["bg-red-500 text-white","🔴 Closed"]
};

function toast(msg, bad=false){
  const t=$("#toast");
  t.textContent=msg;
  t.className="fixed bottom-4 left-1/2 -translate-x-1/2 z-60 px-4 py-2 rounded-full text-sm text-white "+(bad?"bg-red-600":"bg-slate-900");
  t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"), 3500);
}

async function api(path, opts={}){
  const h={"Content-Type":"application/json"};
  if(token) h.Authorization="Bearer "+token;
  const res=await fetch(path, {...opts, headers:h});
  const d=await res.json().catch(()=>({}));
  if(res.status===401 && token){ token=""; localStorage.removeItem("t"); me=null; paintMe(); }
  if(!res.ok) throw new Error(typeof d.detail==="string"?d.detail:"Something went wrong");
  return d;
}

const etb=n=>"ETB "+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});

function modal(html){
  $("#mbox").innerHTML=html;
  $("#modal").classList.remove("hidden");
  document.body.style.overflow="hidden";
}
function closeModal(){
  $("#modal").classList.add("hidden");
  document.body.style.overflow="";
}
$("#modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };

function paintMe(){
  $("#bal").textContent=me?etb(me.wallet_balance):"ETB —";
  const p=$("#phone");
  p.textContent=me?me.phone_number:"Log in";
  p.classList.remove("hidden");
  p.onclick=me?()=>{ if(confirm("Log out?")){ token=""; localStorage.removeItem("t"); me=null; paintMe(); sync(); }}:loginModal;
}

function requireAuth(fn){
  return (...args)=>{ if(!token){ loginModal(); return; } fn(...args); };
}

function loginModal(){
  modal(`<h3 id="modal-title" class="font-bold text-lg mb-4">Log in to A BID</h3>
  <input id="ph" type="tel" class="w-full input-base border border-slate-300 rounded-xl px-4 py-3 mb-3" placeholder="+2519XXXXXXXX" value="+251" autocomplete="tel">
  <div id="otpBox" class="hidden">
    <input id="otp" type="text" inputmode="numeric" class="w-full input-base border border-slate-300 rounded-xl px-4 py-3 mb-3 text-center tracking-widest" placeholder="6-digit code" maxlength="6" autocomplete="one-time-code">
  </div>
  <button id="go" class="w-full bg-emerald-600 text-white rounded-xl py-3 font-semibold touch-target">Send code</button>`);
  let sent=false;
  $("#go").onclick=async()=>{
    try{
      if(!sent){
        await api("/api/auth/send-otp",{method:"POST",body:JSON.stringify({phone_number:$("#ph").value.trim()})});
        sent=true;
        $("#otpBox").classList.remove("hidden");
        $("#go").textContent="Verify & continue";
      }else{
        const d=await api("/api/auth/verify-otp",{method:"POST",body:JSON.stringify({phone_number:$("#ph").value.trim(),code:$("#otp").value.trim()})});
        token=d.token;
        localStorage.setItem("t",token);
        closeModal();
        await sync();
      }
    }catch(e){ toast(e.message, true); }
  };
}

$("#topup").onclick=()=>{ if(!token) return loginModal(); topupModal(); };

function topupModal(){
  modal(`<h3 id="modal-title" class="font-bold text-lg mb-4">Top Up Wallet</h3>
  <div class="grid grid-cols-4 gap-2 mb-3">${[50,100,200,500].map(v=>`<button class="pre border border-slate-300 rounded-xl py-3 text-sm touch-target" data-v="${v}">${v} ETB</button>`).join("")}</div>
  <input id="amt" type="number" min="10" class="w-full input-base border border-slate-300 rounded-xl px-4 py-3 mb-3" placeholder="Amount in ETB" value="100">
  <select id="prov" class="w-full input-base border border-slate-300 rounded-xl px-4 py-3 mb-4"><option value="chapa">Chapa</option><option value="telebirr">Telebirr</option><option value="cbe">CBE Birr</option></select>
  <button id="pay" class="w-full bg-emerald-600 text-white rounded-xl py-3 font-semibold touch-target">Continue</button>`);
  $$(".pre").forEach(b=>b.onclick=()=>$("#amt").value=b.dataset.v);
  $("#pay").onclick=async()=>{
    const body=JSON.stringify({amount:$("#amt").value,provider:$("#prov").value});
    try{
      if(cfg.dev_mode){
        me=await api("/api/wallet/deposit",{method:"POST",body});
        paintMe();
        closeModal();
        toast("Wallet topped up (dev mode)");
      }else{
        const d=await api("/api/wallet/deposit/initiate",{method:"POST",body});
        window.open(d.checkout_url,"_blank");
        closeModal();
        pollDeposit(d.tx_ref);
      }
    }catch(e){ toast(e.message, true); }
  };
}

async function pollDeposit(ref,n=0){
  if(n>60) return;
  try{
    const d=await api("/api/wallet/deposit/status/"+ref);
    if(d.status==="confirmed"){ toast("Deposit confirmed ✔"); return sync(); }
    if(d.status==="failed") return toast("Deposit failed", true);
  }catch(e){}
  setTimeout(()=>pollDeposit(ref,n+1), 4000);
}

function pills(){
  $("#pills").innerHTML=[["all","All"],["rooms","⚡ FLASH ROOMS"],["items","🛍️ BIDDED ITEMS"]].map(([k,l])=>`<button role="tab" data-k="${k}" class="px-4 py-2 rounded-full text-sm font-semibold border touch-target whitespace-nowrap shrink-0 ${filter===k?"bg-emerald-600 text-white border-emerald-600":"bg-white border-slate-200"}" aria-selected="${filter===k}">${l}</button>`).join("");
  $$("#pills button").forEach(b=>b.onclick=()=>{ filter=b.dataset.k; pills(); applyFilter(); });
}

function applyFilter(){
  $("#secRooms").classList.toggle("hidden", filter==="items");
  $("#secItems").classList.toggle("hidden", filter==="rooms");
}

function mkCard(a){
  const el=document.createElement("div");
  el.className="card bg-white rounded-2xl border border-slate-200 p-4 shadow-sm";
  const st={tab:"single",pack:10,mode:"consec",n:1};
  el.st=st;

  el.innerHTML=`
    <div class="mb-3 aspect-video rounded-xl overflow-hidden relative">
      <img data-k="image" class="w-full h-full object-contain p-3 hidden img-fallback" src="" alt="" onerror="this.onerror=null; this.src=''; this.classList.remove('hidden'); this.innerHTML=''; this.style.background='linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%)'; this.alt='Product image'; this.title=''; this.style.display='flex'; this.style.alignItems='center'; this.style.justifyContent='center'; this.style.color='#166534'; this.style.fontSize='2rem'; this.textContent='📦';">
    </div>
    <div class="flex justify-between gap-2 mb-2">
      <div class="min-w-0">
        <div class="font-bold truncate" data-k="title"></div>
        <div class="text-xs text-slate-500 truncate" data-k="desc"></div>
      </div>
      <div data-k="badge" class="text-[11px] h-fit rounded-full px-2 py-1 font-semibold whitespace-nowrap hidden shrink-0"></div>
    </div>
    <div class="text-sm mb-2"><span class="line-through text-slate-400" data-k="val"></span> <span class="font-semibold text-emerald-700" data-k="fee"></span> / bid</div>
    <div data-k="cap" class="mb-2"></div>
    <div class="text-xs text-slate-600 flex justify-between mb-3"><span data-k="bids"></span><span data-k="timer" class="font-mono font-semibold"></span></div>
    <div data-k="ctl" class="space-y-3">
      <div class="flex bg-slate-100 rounded-xl p-1 text-sm">
        <button data-t="single" class="tab flex-1 rounded-lg py-2 touch-target font-medium">Single Bid</button>
        <button data-t="pack" class="tab flex-1 rounded-lg py-2 touch-target font-medium">Multi-Bid Pack</button>
      </div>
      <div data-p="single" class="flex flex-col sm:flex-row gap-2">
        <button class="dec w-12 sm:w-10 rounded-xl bg-slate-100 font-bold text-xl touch-target" aria-label="Decrease">−</button>
        <input type="number" min="1" value="1" class="num flex-1 input-base text-center border border-slate-300 rounded-xl py-3 touch-target" inputmode="numeric">
        <button class="inc w-12 sm:w-10 rounded-xl bg-slate-100 font-bold text-xl touch-target" aria-label="Increase">+</button>
        <button class="place bg-emerald-600 text-white rounded-xl px-4 py-3 font-semibold touch-target">Place Bid</button>
      </div>
      <div data-p="pack" class="hidden space-y-3">
        <div class="grid grid-cols-3 gap-2">${[10,50,100].map(n=>`<button data-n="${n}" class="pk border border-slate-300 rounded-xl py-2.5 text-sm touch-target">${n} Bids</button>`).join("")}</div>
        <div class="flex gap-2">
          <button data-m="consec" class="md flex-1 border border-slate-300 rounded-xl py-2.5 touch-target font-medium">Consecutive</button>
          <button data-m="random" class="md flex-1 border border-slate-300 rounded-xl py-2.5 touch-target font-medium">Random Unique</button>
        </div>
        <div data-k="startRow" class="flex items-center gap-2 text-sm hidden">
          <span class="text-slate-600">Start #</span>
          <input type="number" min="1" value="1" class="start w-20 input-base border border-slate-300 rounded-xl px-3 py-2.5 text-center touch-target" inputmode="numeric">
        </div>
        <div class="text-sm text-slate-600">Total: <b data-k="total" class="font-semibold text-emerald-700"></b></div>
        <button class="buy w-full bg-emerald-600 text-white rounded-xl py-3 font-semibold touch-target">Buy Pack • <span data-k="buyTotal" class="font-normal"></span></button>
      </div>
    </div>
    <div data-k="mine" class="mt-3 hidden">
      <button class="tgl text-xs font-semibold text-slate-600 flex items-center gap-1">▸ My Bids</button>
      <div class="list hidden flex flex-wrap gap-1 mt-2"></div>
    </div>`;

  const q=s=>el.querySelector(s);
  const qa=s=>el.querySelectorAll(s);

  const mode=()=>{
    qa(".tab").forEach(b=>b.className="tab flex-1 rounded-lg py-2 touch-target font-medium "+(b.dataset.t===st.tab?"bg-white shadow font-semibold":""));
    q('[data-p="single"]').classList.toggle("hidden", st.tab!=="single");
    q('[data-p="pack"]').classList.toggle("hidden", st.tab!=="pack");
    qa(".pk").forEach(b=>b.className="pk border border-slate-300 rounded-xl py-2.5 text-sm touch-target "+(+b.dataset.n===st.pack?"bg-emerald-600 text-white border-emerald-600":""));
    qa(".md").forEach(b=>b.className="md flex-1 border border-slate-300 rounded-xl py-2.5 touch-target font-medium "+(b.dataset.m===st.mode?"bg-emerald-600 text-white border-emerald-600":""));
    const showStart=st.mode==="consec";
    q('[data-k="startRow"]').classList.toggle("hidden", !showStart);
    const fee=el.a?.bid_fee||0;
    const total=st.pack*fee;
    q('[data-k="total"]').textContent=etb(total);
    q('[data-k="buyTotal"]').textContent=etb(total);
  };

  el.refreshMode=mode;

  qa(".tab").forEach(b=>b.onclick=()=>{ st.tab=b.dataset.t; mode(); });
  qa(".pk").forEach(b=>b.onclick=()=>{ st.pack=+b.dataset.n; mode(); });
  qa(".md").forEach(b=>b.onclick=()=>{ st.mode=b.dataset.m; mode(); });

  q(".dec").onclick=()=>{ const i=q(".num"); i.value=Math.max(1, (+i.value||1)-1); };
  q(".inc").onclick=()=>{ const i=q(".num"); i.value=(+i.value||0)+1; };

  q(".tgl").onclick=()=>{ const l=q(".list"); l.classList.toggle("hidden"); q(".tgl").innerHTML=(l.classList.contains("hidden")?"▸":"▾")+' My Bids'; };

  // Single bid: open checkout sheet
  q(".place").onclick=e=>{
    const v=Math.floor(+q(".num").value);
    if(!(v>=1)) return toast("Enter a positive whole number", true);
    openCheckoutSheet(el.a, [v]);
  };

  // Pack bid: open checkout sheet
  q(".buy").onclick=e=>{
    const n=st.pack;
    let amts=[];
    if(st.mode==="consec"){
      const s=Math.max(1, Math.floor(+q(".start").value||1));
      for(let i=0;i<n;i++) amts.push(s+i);
    }else{
      const taken=new Set((el.a.user_bids||[]).map(b=>b.amount));
      const range=Math.max(n*10,200);
      const set=new Set();
      let g=0;
      while(set.size<n && g++<100000){
        const x=1+Math.floor(Math.random()*range);
        if(!set.has(x) && !taken.has(x)) set.add(x);
      }
      amts=[...set];
    }
    openCheckoutSheet(el.a, amts);
  };

  mode();
  return el;
}

function upd(el,a){
  el.a=a;
  const q=s=>el.querySelector(`[data-k="${s}"]`);

  q("title").textContent=a.title;
  q("desc").textContent=a.description||"";
  q("val").textContent=etb(a.market_value);
  q("fee").textContent=etb(a.bid_fee);

  const img=q("image");
  if(a.image_url){
    img.src=a.image_url;
    img.alt=a.title;
    img.classList.remove("hidden");
    img.onerror=()=>{
      img.src="";
      img.alt="";
      img.classList.remove("hidden");
      img.style.background="linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%)";
      img.style.display="flex";
      img.style.alignItems="center";
      img.style.justifyContent="center";
      img.style.color="#166534";
      img.style.fontSize="2rem";
      img.textContent="📦";
      img.onerror=null;
    };
  }else{
    img.classList.add("hidden");
    img.onerror=null;
  }

  const left=Math.max(0, a.max_slots-a.filled_slots);
  const pct=Math.min(100, a.filled_slots/a.max_slots*100);
  q("cap").innerHTML=a.is_room?`<div class="flex justify-between text-xs font-semibold"><span>Room Capacity</span><span class="${left<=10?"text-red-600 animate-pulse":"text-emerald-700"}">${left} Slots Left</span></div><div class="h-2 bg-slate-100 rounded-full mt-1 overflow-hidden"><div class="h-full ${pct>80?"bg-red-500":"bg-emerald-500"} transition-all" style="width:${pct}%"></div></div><div class="text-[11px] text-slate-500 mt-1">${a.filled_slots} / ${a.max_slots} filled</div>`:"";

  q("bids").textContent=a.is_room?"":`${a.filled_slots.toLocaleString()} bids cast`;

  el.ends=a.ends_at?new Date(a.ends_at).getTime():null;

  const b=q("badge"), s=ST[a.user_status];
  b.classList.toggle("hidden", !s);
  if(s){ b.className="text-[11px] h-fit rounded-full px-2 py-1 font-semibold whitespace-nowrap "+s[0]; b.textContent=s[1]; }
  if(a.won){ b.className="text-[11px] h-fit rounded-full px-2 py-1 font-semibold bg-yellow-400 text-yellow-950"; b.textContent="🏆 You won!"; }

  const live=a.status==="active";
  q("ctl").classList.toggle("hidden", !live);

  const m=q("mine");
  m.classList.toggle("hidden", !a.user_bids?.length);
  el.querySelector(".list").innerHTML=(a.user_bids||[]).map(x=>`<span class="bid-status ${x.unique?"bg-blue-100 text-blue-800":"bg-amber-100 text-amber-800"}" title="${x.unique?"unique":"duplicated"}">${x.amount}${x.unique?" ✓":" ✗"}</span>`).join("");

  el.refreshMode();
  tick(el);
}

function tick(el){
  const t=el.querySelector('[data-k="timer"]');
  if(!el.a) return;
  if(el.a.status!=="active"){ t.textContent="Ended"; return; }
  if(!el.ends){ t.textContent=""; return; }
  let s=Math.max(0, Math.floor((el.ends-Date.now())/1000));
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  t.textContent=(d?d+"d ":"")+[h,m,s%60].map(x=>String(x).padStart(2,"0")).join(":");
}

setInterval(()=>Object.values(cards).forEach(tick), 1000);

function render(list){
  const seen=new Set();
  list.forEach(a=>{
    seen.add(a.id);
    let el=cards[a.id];
    if(!el){ el=cards[a.id]=mkCard(a); }
    const host=a.is_room?$("#rooms"):$("#items");
    if(el.parentNode!==host) host.appendChild(el);
    upd(el,a);
  });
  Object.keys(cards).forEach(id=>{ if(!seen.has(+id)){ cards[id].remove(); delete cards[id]; } });
  $("#roomsEmpty").classList.toggle("hidden", list.some(a=>a.is_room));
  $("#itemsEmpty").classList.toggle("hidden", list.some(a=>!a.is_room));
}

async function sync(){
  try{
    const [a,m]=await Promise.all([api("/api/auctions"), token?api("/api/me").catch(()=>null):null]);
    data=a;
    if(m) me=m;
    paintMe();
    render(a);
  }catch(e){}
}

let ws, wsTimer;
function connect(){
  const p=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${p}://${location.host}/ws`);
  ws.onopen=()=>{ $("#dot").className="w-2.5 h-2.5 rounded-full bg-emerald-500"; setInterval(()=>ws.readyState===1&&ws.send("ping"), 25000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="slots" && cards[m.auction_id] && cards[m.auction_id].a){
      cards[m.auction_id].a.filled_slots=m.filled_slots;
      upd(cards[m.auction_id], cards[m.auction_id].a);
    }
    if(m.type==="closed" || m.type==="slots") sync();
  };
  ws.onclose=()=>{ $("#dot").className="w-2.5 h-2.5 rounded-full bg-slate-300"; clearTimeout(wsTimer); wsTimer=setTimeout(connect, 2000); };
  ws.onerror=()=>ws.close();
}

// ===== Checkout Sheet =====
let checkoutState = { auction: null, bidAmounts: [], method: "wallet", polling: false };

function openCheckoutSheet(auction, bidAmounts){
  checkoutState.auction = auction;
  checkoutState.bidAmounts = bidAmounts;
  checkoutState.method = "wallet";
  checkoutState.polling = false;
  renderCheckoutSheet();
  $("#checkoutSheet").classList.remove("hidden");
  document.body.style.overflow="hidden";
}

function closeCheckout(){
  $("#checkoutSheet").classList.add("hidden");
  document.body.style.overflow="";
  checkoutState.polling = false;
}

function renderCheckoutSheet(){
  const a = checkoutState.auction;
  const amts = checkoutState.bidAmounts;
  const total = a.bid_fee * amts.length;
  const walletBal = me?.wallet_balance || 0;
  const canWallet = walletBal >= total;

  const bidSummary = amts.length === 1
    ? `Bid #${amts[0]}`
    : `${amts.length} bids: ${amts.slice(0,5).join(", ")}${amts.length>5?" …":""}`;

  const methods = [
    {id:"wallet", label:"A BID Wallet", icon:"💰", desc: canWallet ? `Balance: ${etb(walletBal)}` : `Insufficient (need ${etb(total)}, have ${etb(walletBal)})`, disabled: !canWallet},
    {id:"telebirr", label:"Telebirr (via Chapa)", icon:"📱", desc:"Pay with Telebirr", disabled:false},
    {id:"cbebirr", label:"CBE Birr (via Chapa)", icon:"🏦", desc:"Pay with CBE Birr", disabled:false},
    {id:"chapa", label:"Ebirr / M-Pesa / Card (via Chapa)", icon:"💳", desc:"Ebirr, M-Pesa, Visa/Mastercard", disabled:false},
  ];

  $("#checkoutBody").innerHTML = `
    <div class="space-y-3">
      <div class="bg-slate-50 rounded-xl p-4">
        <div class="font-semibold text-slate-900">${a.title}</div>
        <div class="text-sm text-slate-600 mt-1">${bidSummary}</div>
        <div class="flex justify-between mt-2 pt-2 border-t border-slate-200">
          <span class="font-medium text-slate-700">Total</span>
          <span class="font-bold text-emerald-700 text-lg">${etb(total)}</span>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Payment Method</label>
        <div class="space-y-2" id="methodList">
          ${methods.map(m=>`
            <button type="button" class="method-btn w-full text-left rounded-xl p-4 flex items-center gap-3 touch-target ${m.disabled?"disabled":""}" data-method="${m.id}" ${m.disabled?"disabled":""}>
              <span class="text-2xl">${m.icon}</span>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-slate-900">${m.label}</div>
                <div class="text-xs text-slate-500 truncate">${m.desc}</div>
              </div>
              <svg class="w-5 h-5 text-emerald-600 shrink-0 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </button>
          `).join("")}
        </div>
      </div>

      ${!canWallet ? `<p class="text-xs text-amber-700 bg-amber-50 rounded-lg p-3 flex items-center gap-2">⚠️ Wallet balance too low. Top up or choose another method.</p>` : ""}

      <div id="checkoutStatus" class="hidden p-3 rounded-lg text-sm"></div>
    </div>
  `;

  // Method selection
  $$("#methodList button").forEach(btn=>{
    btn.onclick=()=>{
      if(btn.disabled) return;
      checkoutState.method = btn.dataset.method;
      $$("#methodList button").forEach(b=>{
        b.classList.remove("active","border-emerald-500","bg-emerald-50");
        b.querySelector("svg")?.classList.add("hidden");
      });
      btn.classList.add("active","border-emerald-500","bg-emerald-50");
      btn.querySelector("svg")?.classList.remove("hidden");
      updatePayButton();
    };
  });

  // Initial active state
  const firstEnabled = methods.find(m=>!m.disabled);
  if(firstEnabled){
    checkoutState.method = firstEnabled.id;
    const btn = $(`#methodList button[data-method="${firstEnabled.id}"]`);
    btn?.classList.add("active","border-emerald-500","bg-emerald-50");
    btn?.querySelector("svg")?.classList.remove("hidden");
  }
  updatePayButton();

  // Pay button handler
  $("#checkoutPayBtn").onclick = async () => {
    if(checkoutState.method === "wallet"){
      await executeWalletBid();
    }else{
      await launchChapaCheckout();
    }
  };
}

function updatePayButton(){
  const btn = $("#checkoutPayBtn");
  const a = checkoutState.auction;
  const total = a.bid_fee * checkoutState.bidAmounts.length;
  if(checkoutState.method === "wallet"){
    btn.textContent = `Pay ${etb(total)} & Place Bid (Wallet)`;
  }else{
    const labels = {telebirr:"Telebirr", cbebirr:"CBE Birr", chapa:"Ebirr/M-Pesa/Card"};
    btn.textContent = `Pay ${etb(total)} via ${labels[checkoutState.method] || "Chapa"}`;
  }
  btn.disabled = false;
}

async function executeWalletBid(){
  const btn = $("#checkoutPayBtn");
  btn.disabled = true;
  btn.textContent = "Placing bid…";
  try{
    const d = await api(`/api/auctions/${checkoutState.auction.id}/bid-batch`,{
      method:"POST", body:JSON.stringify({bid_amounts: checkoutState.bidAmounts})
    });
    toast(`✅ ${d.placed} bid${d.placed>1?"s":""} placed!`);
    if(me){ me.wallet_balance = d.wallet_balance; paintMe(); }
    closeCheckout();
    await sync();
  }catch(e){
    toast(e.message, true);
    btn.disabled = false;
    updatePayButton();
  }
}

async function launchChapaCheckout(){
  const btn = $("#checkoutPayBtn");
  btn.disabled = true;
  btn.textContent = "Opening checkout…";
  try{
    const d = await api(`/api/auctions/${checkoutState.auction.id}/bid-checkout`,{
      method:"POST", body:JSON.stringify({
        bid_amounts: checkoutState.bidAmounts,
        payment_method: checkoutState.method
      })
    });
    closeCheckout();
    window.open(d.checkout_url, "_blank");
    pollBidCheckout(d.tx_ref);
  }catch(e){
    toast(e.message, true);
    btn.disabled = false;
    updatePayButton();
  }
}

async function pollBidCheckout(ref, attempts=0){
  if(attempts > 60) return;
  try{
    const d = await api("/api/wallet/deposit/status/"+ref);
    if(d.status === "confirmed"){
      let msg = "Payment confirmed ✅";
      if(d.bids_placed){
        msg += ` — ${d.bids_placed} bid${d.bids_placed>1?"s":""} placed automatically`;
      }else if(d.auction_id){
        msg += " — Room closed or auction ended. Funds added to your wallet.";
      }
      toast(msg);
      await sync();
      return;
    }
    if(d.status === "failed"){
      toast("Payment failed: " + (d.failure_reason || "Unknown error"), true);
      return;
    }
  }catch(e){}
  setTimeout(()=>pollBidCheckout(ref, attempts+1), 4000);
}

(async()=>{
  pills();
  applyFilter();
  try{ cfg=await api("/api/payments/config"); }catch(e){}
  paintMe();
  await sync();
  connect();
  setInterval(sync, 5000);
})();
</script>
