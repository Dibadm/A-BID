  <span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>

  <div id="bal" class="text-sm font-bold bg-emerald-50 text-emerald-700 rounded-full px-3 py-2.5 whitespace-nowrap"></div>
  <button id="topup" class="text-sm font-semibold bg-emerald-600 text-white rounded-full px-4 whitespace-nowrap" data-i18n="topUp"></button>
 </div>
</header>

  <p id="roomsEmpty" class="text-sm text-slate-500 hidden" data-i18n="noRooms"></p>
 </section>
 <section id="secItems" class="mb-8">

  <div id="items" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  <p id="itemsEmpty" class="text-sm text-slate-500 hidden" data-i18n="noItems"></p>
 </section>
 <section id="secWinners" class="hidden mb-8">
  <h2 class="font-bold text-lg mb-3" data-i18n="winnersTitle"></h2>
  <div id="winnersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  <p id="winnersEmpty" class="text-sm text-slate-500 hidden" data-i18n="noWinners"></p>

</main>

</div>

function ckSelWallet(){ck.method="wallet";ck.prov=null;ckRender()}
function ckSelProv(k){ck.method="direct";ck.prov=k;ckRender()}
function ckRender(){if(!ck)return;const a=ck.a,n=ck.amounts.length,cost=a.bid_fee*n,bal=me?me.wallet_balance:0,low=bal<cost;
 if(ck.phase==="choose"){
  const nums=ck.amounts.slice(0,12).map(x=>`<span class="text-xs px-2 py-1 rounded-full bg-emerald-50 text-emerald-800">#${x}</span>`).join(" ")+(n>12?` <span class="text-xs text-slate-500">${t("more",{n:n-12})}</span>`:"");
  const wsel=ck.method==="wallet";
  const body=`<div class="font-bold break-words">${esc(a.title)}</div><div class="text-sm text-slate-600 mb-2">${t("summary",{n,fee:money(a.bid_fee)})} = <b class="text-emerald-700">${money(cost)}</b></div>
  <div class="text-xs text-slate-500 mb-1">${t("yourNums")}</div><div class="flex flex-wrap gap-1 mb-4">${nums}</div>
  <div class="text-sm font-semibold mb-2">${t("payWith")}</div>
  <button onclick="ckSelWallet()" class="w-full text-left rounded-xl border px-3 py-2 mb-2 ${wsel?"border-emerald-600 bg-emerald-50":"border-slate-200"}"><div class="font-semibold">💼 ${t("wallet")}</div><div class="text-xs text-slate-500">${t("balance")}: ${money(bal)}</div></button>
  ${wsel&&low?`<p class="text-xs text-red-600 mb-2">${t("notEnough")}</p>`:""}
  <div class="text-xs text-slate-500 mt-3 mb-2">${t("direct")}</div>${provChips(ck.prov,"ckSelProv")}`;
  const pname=(PROV.find(p=>p[0]===ck.prov)||[0,""])[1];const dis=ck.busy||(wsel&&low)||(!wsel&&!ck.prov);
  openSheet("checkout",body,`<button onclick="ckPay()" ${dis?"disabled":""} class="w-full bg-emerald-600 text-white rounded-xl font-semibold ${dis?"opacity-50":""}">${wsel?t("payWallet",{amt:money(cost)}):t("payDirect",{amt:money(cost),p:pname})}</button>`);return}
 if(ck.phase==="waiting"){openSheet("checkout",`<div class="text-center py-6"><div class="text-4xl animate-pulse mb-3">⏳</div><div class="font-semibold">${t("waiting")}</div><p class="text-xs text-slate-500 mt-2">${t("waitNote")}</p>${ck.link?`<a href="${esc(ck.link)}" target="_blank" rel="noopener" class="inline-flex items-center justify-center min-h-[44px] mt-4 px-4 rounded-xl bg-slate-100 text-sm font-semibold">${t("openPay")}</a>`:""}</div>`,`<button onclick="closeSheet()" class="w-full bg-slate-100 rounded-xl font-semibold">${t("cancel")}</button>`);return}
 const m={ok:["✅",t("payOk")],kept:["💼",ck.msg||t("kept")],fail:["❌",ck.msg||t("failed")],timeout:["⏳",t("timeout")]}[ck.phase];
 openSheet("checkout",`<div class="text-center py-6"><div class="text-4xl mb-3">${m[0]}</div><div class="font-semibold break-words">${esc(m[1])}</div></div>`,`<button onclick="closeSheet()" class="w-full bg-emerald-600 text-white rounded-xl font-semibold">${t("close")}</button>`)}
async function ckPay(){if(!ck||ck.busy)return;ck.busy=true;ckRender();const a=ck.a,body=ck.amounts;
 try{
  if(ck.method==="wallet"){const d=await api(`/api/auctions/${a.id}/bid-batch`,{method:"POST",body:JSON.stringify({bid_amounts:body})});
   toast(t("placed",{n:d.placed}));if(me){me.wallet_balance=d.wallet_balance;paintMe()}closeSheet();sync()}
  else{const d=await api(`/api/auctions/${a.id}/bid-checkout`,{method:"POST",body:JSON.stringify({bid_amounts:body,provider:ck.prov})});
   ck.phase="waiting";ck.busy=false;ck.link=d.checkout_url;ck.poll={stop:false};ckRender();window.open(d.checkout_url,"_blank","noopener");
   pollPay(d.tx_ref,r=>{if(!ck)return;if(r.status==="confirmed"){ck.phase=r.bids_placed?"ok":"kept";ck.msg=r.note||""}else if(r.status==="failed"){ck.phase="fail";ck.msg=r.note||""}else ck.phase="timeout";sync();ckRender()},ck.poll)}
 }catch(e){toast(e.message,1);if(ck){ck.busy=false;ckRender()}}}
// ---- cards ----
function mkCard(){
 const el=document.createElement("div");el.className="card bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col min-w-0";
 const st={tab:"single",pack:10,mode:"consec"};
 el.innerHTML=`<div class="relative aspect-[4/3] bg-gradient-to-br from-emerald-50 to-slate-100 flex items-center justify-center">
  <img data-k="img" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-contain p-3 hidden"><div data-k="ph" class="text-6xl select-none"></div>
  <span data-k="tag" class="absolute top-2 left-2 text-[10px] font-bold bg-amber-400 text-amber-950 rounded-full px-2 py-1 hidden" data-i18n="limited"></span>
  <span data-k="badge" class="absolute top-2 right-2 text-[11px] font-semibold rounded-full px-2 py-1 hidden max-w-[70%] text-center"></span></div>
 <div class="p-4 flex flex-col gap-2 flex-1 min-w-0">
  <div class="font-bold leading-tight break-words" data-k="title"></div><div class="text-xs text-slate-500 break-words" data-k="desc"></div>
  <div class="text-sm"><span class="text-xs text-slate-500" data-i18n="retail"></span> <span class="line-through text-slate-400" data-k="val"></span> · <span class="font-semibold text-emerald-700" data-k="fee"></span> <span class="text-xs text-slate-500" data-i18n="perBid"></span></div>
  <div data-k="cap"></div>
  <div class="text-xs text-slate-600 flex justify-between gap-2"><span data-k="bids"></span><span data-k="timer" class="font-mono font-semibold"></span></div>
  <div data-k="ctl" class="mt-1">
   <div class="flex bg-slate-100 rounded-xl p-1 text-sm mb-2 gap-1"><button data-t="single" class="tab flex-1 rounded-lg" data-i18n="single"></button><button data-t="pack" class="tab flex-1 rounded-lg" data-i18n="pack"></button></div>
   <div data-p="single"><div class="flex gap-2"><button class="dec w-11 h-11 shrink-0 rounded-xl bg-slate-100 font-bold text-lg">−</button><input type="number" inputmode="numeric" min="1" value="1" class="num flex-1 min-w-0 h-11 text-base text-center border border-slate-300 rounded-xl"><button class="inc w-11 h-11 shrink-0 rounded-xl bg-slate-100 font-bold text-lg">+</button></div>
    <button class="place w-full mt-2 bg-emerald-600 text-white rounded-xl font-semibold" data-i18n="placeBid"></button></div>
   <div data-p="pack" class="hidden space-y-2">
    <div class="grid grid-cols-3 gap-2">${[10,50,100].map(n=>`<button data-n="${n}" data-i18n="bidsN" class="pk rounded-xl border text-sm"></button>`).join("")}</div>
    <div class="flex gap-2 text-sm"><button data-m="consec" class="md flex-1 rounded-xl border" data-i18n="consec"></button><button data-m="random" class="md flex-1 rounded-xl border" data-i18n="random"></button></div>
    <div data-k="startRow" class="flex items-center gap-2 text-sm"><span class="shrink-0" data-i18n="startAt"></span><input type="number" inputmode="numeric" min="1" value="1" class="start flex-1 min-w-0 h-11 text-base text-center border border-slate-300 rounded-xl"></div>
    <div class="text-sm flex justify-between"><span data-i18n="total"></span><b data-k="total"></b></div>
    <button class="buy w-full bg-emerald-600 text-white rounded-xl font-semibold" data-i18n="buyPack"></button></div></div>
  <div data-k="mine" class="hidden"><button class="tgl text-xs font-semibold text-slate-600"></button><div class="list hidden flex flex-wrap gap-1 mt-1"></div></div></div>`;
 const q=s=>el.querySelector(s),qa=s=>el.querySelectorAll(s);
 const mode=()=>{qa(".tab").forEach(b=>b.className="tab flex-1 rounded-lg "+(b.dataset.t===st.tab?"bg-white shadow font-semibold":""));
  qa('[data-p="single"]').forEach(x=>x.classList.toggle("hidden",st.tab!=="single"));q('[data-p="pack"]').classList.toggle("hidden",st.tab!=="pack");
  qa(".pk").forEach(b=>b.className="pk rounded-xl border text-sm "+(+b.dataset.n===st.pack?"bg-emerald-600 text-white border-emerald-600":"border-slate-200"));
  qa(".md").forEach(b=>b.className="md flex-1 rounded-xl border "+(b.dataset.m===st.mode?"bg-emerald-600 text-white border-emerald-600":"border-slate-200"));
  q('[data-k="startRow"]').classList.toggle("hidden",st.mode!=="consec");q('[data-k="total"]').textContent=money(st.pack*(el.a?.bid_fee||0))};
 el.refreshMode=mode;
 qa(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;mode()});qa(".pk").forEach(b=>b.onclick=()=>{st.pack=+b.dataset.n;mode()});qa(".md").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;mode()});
 q(".dec").onclick=()=>{const i=q(".num");i.value=Math.max(1,(+i.value||1)-1)};q(".inc").onclick=()=>{const i=q(".num");i.value=(+i.value||0)+1};
 q(".tgl").onclick=()=>{q(".list").classList.toggle("hidden");el.open=!el.open;q(".tgl").textContent=(el.open?"▾ ":"▸ ")+t("myBids")};
 q(".place").onclick=()=>{const v=Math.floor(+q(".num").value);if(!(v>=1))return toast(t("enterNum"),1);openCheckout(el.a,[v])};
 q(".buy").onclick=()=>{const a=el.a,n=st.pack;if(a.is_room){const left=a.max_slots-a.filled_slots;if(n>left)return toast(t("slotsOnly",{n:left}),1)}
  let amts=[];if(st.mode==="consec"){const s=Math.max(1,Math.floor(+q(".start").value||1));for(let i=0;i<n;i++)amts.push(s+i)}
  else{const taken=new Set((a.user_bids||[]).map(b=>b.amount)),range=Math.max(n*10,200),set=new Set();let g=0;while(set.size<n&&g++<100000){const x=1+Math.floor(Math.random()*range);if(!taken.has(x))set.add(x)}amts=[...set].sort((x,y)=>x-y)}
  openCheckout(a,amts)};
 mode();return el}
function upd(el,a){el.a=a;const q=k=>el.querySelector(`[data-k="${k}"]`);
 q("title").textContent=a.title;q("desc").textContent=a.description||"";q("val").textContent=money(a.market_value);q("fee").textContent=money(a.bid_fee);
 const img=q("img"),ph=q("ph");ph.textContent=a.is_room?"⚡":"🎁";
 if(a.image_url){if(img.dataset.src!==a.image_url){img.dataset.src=a.image_url;img.classList.add("hidden");ph.classList.remove("hidden");
   img.onload=()=>{img.classList.remove("hidden");ph.classList.add("hidden")};img.onerror=()=>{img.classList.add("hidden");ph.classList.remove("hidden")};img.src=a.image_url}}
 else{img.classList.add("hidden");ph.classList.remove("hidden")}
 q("tag").classList.toggle("hidden",!(a.is_room&&a.status==="active"));
 const b=q("badge");let cls=null,txt="";
 if(a.won){cls="bg-yellow-400 text-yellow-950";txt=t("won")}else if(a.user_status&&ST[a.user_status]){cls=ST[a.user_status];txt=t(a.user_status)}else if(a.status!=="active"){cls="bg-slate-700 text-white";txt=t("ended")}
 b.classList.toggle("hidden",!cls);if(cls){b.className="absolute top-2 right-2 text-[11px] font-semibold rounded-full px-2 py-1 max-w-[70%] text-center "+cls;b.textContent=txt}
 let cap="";if(a.is_room){const left=Math.max(0,a.max_slots-a.filled_slots),pct=Math.min(100,a.filled_slots/a.max_slots*100);
  cap=`<div class="flex justify-between text-xs font-semibold"><span>${t("roomCap")}</span><span class="${left<=10?"text-red-600 animate-pulse":"text-emerald-700"}">${t("slotsLeft",{n:left})}</span></div><div class="h-2 bg-slate-100 rounded-full mt-1 overflow-hidden"><div class="h-full ${pct>80?"bg-red-500":"bg-emerald-500"} transition-all" style="width:${pct}%"></div></div><div class="text-[11px] text-slate-500 mt-0.5">${t("filled",{a:a.filled_slots,b:a.max_slots})}</div>`}
 if(a.winning_bid!=null)cap+=`<div class="text-sm font-semibold text-emerald-700 mt-1">🏆 ${t("winBid",{n:a.winning_bid})}</div>`;q("cap").innerHTML=cap;
 q("bids").textContent=a.is_room?"":t("bidsCast",{n:a.filled_slots.toLocaleString()});
 el.ends=a.ends_at?new Date(a.ends_at).getTime():null;
 q("ctl").classList.toggle("hidden",a.status!=="active");
 q("mine").classList.toggle("hidden",!a.user_bids.length);el.querySelector(".tgl").textContent=(el.open?"▾ ":"▸ ")+t("myBids");
 el.querySelector(".list").innerHTML=a.user_bids.map(x=>`<span class="text-xs px-2 py-0.5 rounded-full ${x.unique?"bg-blue-100 text-blue-800":"bg-amber-100 text-amber-800"}">${x.amount}${x.unique?" ✓":" ✗"}</span>`).join("");
 el.refreshMode();tick(el)}
function tick(el){const e=el.querySelector('[data-k="timer"]');if(!el.a)return;if(el.a.status!=="active"){e.textContent=t("ended");return}
 if(!el.ends){e.textContent="";return}const s=Math.max(0,Math.floor((el.ends-Date.now())/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
 e.textContent="⏱ "+(d?d+"d ":"")+[h,m,s%60].map(x=>String(x).padStart(2,"0")).join(":")}
setInterval(()=>Object.values(cards).forEach(tick),1000);
function render(list){const seen=new Set();
 list.forEach(a=>{seen.add(a.id);let el=cards[a.id];if(!el)el=cards[a.id]=mkCard();const host=a.is_room?$("#rooms"):$("#items");if(el.parentNode!==host)host.appendChild(el);upd(el,a)});
 Object.keys(cards).forEach(id=>{if(!seen.has(+id)){cards[id].remove();delete cards[id]}});renderEmpty(list)}
let lastList=[];function renderEmpty(l){if(l)lastList=l;$("#roomsEmpty").classList.toggle("hidden",lastList.some(a=>a.is_room));$("#itemsEmpty").classList.toggle("hidden",lastList.some(a=>!a.is_room))}
// ---- winners ----
async function loadWinners(){try{winners=await api("/api/winners?limit=30")}catch(e){}renderWinners()}
function renderWinners(){const g=$("#winnersGrid");$("#winnersEmpty").classList.toggle("hidden",winners.length>0);
 g.innerHTML=winners.map(w=>`<article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col min-w-0">
  <div class="relative aspect-[4/3] bg-gradient-to-br from-emerald-50 to-slate-100 flex items-center justify-center"><div class="text-6xl select-none">🏆</div>${w.image_url?`<img src="${esc(w.image_url)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-contain p-3 bg-white" onerror="this.classList.add('hidden')">`:""}
   <span class="absolute top-2 left-2 text-[11px] font-semibold bg-emerald-600 text-white rounded-full px-2 py-1">${t("verified")}</span></div>
  <div class="p-4 flex flex-col gap-2 min-w-0"><div class="font-bold leading-tight break-words">${esc(w.title)}</div>
   <div class="text-sm text-slate-600">${esc(w.winner_masked)}${w.winner_city?` · 📍 ${esc(w.winner_city)}`:""}</div>
   <div class="rounded-xl bg-emerald-50 p-3 text-sm"><div class="font-semibold text-emerald-800">${t("winBid",{n:w.winning_bid})}</div><div class="text-xs text-slate-600">${t("retailValue")}: <span class="line-through">${money(w.market_value)}</span> · ${money(w.bid_fee)} ${t("perBid")}</div></div>
   ${w.winner_quote?`<blockquote class="text-sm italic text-slate-700 border-l-4 border-emerald-500 pl-3 break-words">“${esc(w.winner_quote)}”</blockquote>`:""}
   ${w.winner_photo_url?`<img src="${esc(w.winner_photo_url)}" alt="" loading="lazy" class="w-full rounded-xl object-cover max-h-64" onerror="this.classList.add('hidden')">`:""}
   ${w.winner_video_url?`<video controls playsinline preload="metadata" class="w-full rounded-xl bg-black max-h-64" src="${esc(w.winner_video_url)}"></video>`:""}</div></article>`).join("")}
// ---- sync + realtime ----
async function sync(){if(syncing)return;syncing=true;try{const [a,m]=await Promise.all([api("/api/auctions"),token?api("/api/me").catch(()=>null):null]);if(m)me=m;paintMe();render(a)}catch(e){}syncing=false}
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,800)}
function connect(){const p=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(`${p}://${location.host}/ws`);
 ws.onopen=()=>{wsDelay=1000;$("#dot").className="w-2.5 h-2.5 rounded-full bg-emerald-500"};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(m.type==="slots"){const c=cards[m.auction_id];if(c&&c.a){c.a.filled_slots=m.filled_slots;upd(c,c.a)}syncSoon()}
  else if(m.type==="auction_ended"){if(m.winning_bid!=null)toast(t("endedToast",{n:m.winning_bid,who:m.winner_masked||"—"}));syncSoon();if(filter==="winners")loadWinners()}
  else if(m.type==="closed")syncSoon()};
 ws.onclose=()=>{$("#dot").className="w-2.5 h-2.5 rounded-full bg-slate-300";clearTimeout(wsT);wsT=setTimeout(connect,wsDelay);wsDelay=Math.min(wsDelay*2,10000)};ws.onerror=()=>ws.close()}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send("ping")},25000);
setInterval(()=>{if(!document.hidden)sync()},5000);
(async()=>{drawHow();drawPills();showSections();applyLang();paintMe();try{cfg=await api("/api/payments/config")}catch(e){}await sync();connect()})();
</script></body></html>
