<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>LowBid · ዝቅ ጨረታ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Noto+Sans+Ethiopic:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>

         padding-bottom: env(safe-area-inset-bottom,0px);
         background-image: radial-gradient(60rem 28rem at 85% -10%, rgba(232,184,75,.13), transparent 60%), radial-gradient(50rem 26rem at -10% 10%, rgba(47,179,109,.10), transparent 60%); background-attachment: fixed; }
  .disp { font-family:'Fraunces','Noto Sans Ethiopic',serif; letter-spacing:-.01em; }
  .gold { color: var(--gold); } .mute { color: var(--mute); }

  .inp { background: rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:15px; color:#fff; outline:none; }
  .inp:focus { border-color: var(--gold); box-shadow:0 0 0 3px rgba(232,184,75,.18); }
  .inp option { background:#12161f; }
  .cta { background: linear-gradient(135deg,#f3cd6b,#d99a1e); color:#1a1405; font-weight:800; border-radius:12px; padding:0 18px; transition:transform .12s, filter .2s; }
  .cta:hover { filter:brightness(1.08); } .cta:active { transform:scale(.96); } .cta:disabled, .pk:disabled { opacity:.35; cursor:not-allowed; }
  .lang button { padding:5px 10px; font-size:12px; font-weight:700; border-radius:10px; color:var(--mute); }
  .lang button.on { background: var(--gold); color:#1a1405; }
  .tk { position:relative; background: linear-gradient(180deg, #151a25, #10131b); border:1px solid var(--line); border-radius:22px; overflow:hidden; transition: transform .25s, border-color .25s; }
  .tk:hover { transform: translateY(-3px); border-color: hsl(var(--h) 70% 55% / .6); }
  .pat { position:relative; height:104px; display:flex; align-items:center; padding:0 18px; border-bottom:2px dashed rgba(255,255,255,.14);
         background: repeating-linear-gradient(45deg, hsl(var(--h) 85% 70% / .14) 0 1px, transparent 1px 14px), repeating-linear-gradient(-45deg, hsl(var(--h) 85% 70% / .14) 0 1px, transparent 1px 14px), linear-gradient(135deg, hsl(var(--h) 55% 22%), hsl(var(--h) 60% 10%)); }
  .em { font-size:46px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  .ring { --p:0; --rc: var(--gold); margin-left:auto; width:70px; height:70px; border-radius:50%; display:grid; place-items:center; position:relative;
          background: conic-gradient(var(--rc) calc(var(--p) * 1%), rgba(255,255,255,.12) 0); transition: --p .9s cubic-bezier(.2,.8,.2,1); }
  .ring::before { content:''; position:absolute; inset:7px; border-radius:50%; background:#0d1017; }
  .ring b { position:relative; font-size:15px; font-weight:800; }
  .badge { position:absolute; top:12px; left:16px; font-size:10px; letter-spacing:.08em; font-weight:800; padding:3px 9px; border-radius:99px; }
  .b-live { background:rgba(47,179,109,.2); color:#6ee7a8; } .b-lock { background:rgba(242,194,48,.2); color:#f6d56a; } .b-end { background:rgba(229,72,77,.2); color:#ff8d90; }

  .bar i { display:block; height:100%; border-radius:99px; width:0; transition: width .9s cubic-bezier(.2,.8,.2,1), background .4s;

  .st { border-radius:14px; padding:10px 12px; font-size:13px; font-weight:700; text-align:center; border:1px solid; }
  .st-win { background:rgba(47,179,109,.16); color:#7bf0b2; border-color:rgba(47,179,109,.55); box-shadow:0 0 28px rgba(47,179,109,.25); }

<header class="sticky top-0 z-30 glass">

      <div class="leading-tight"><div class="disp font-extrabold text-lg" data-i18n="brand"></div>
        <div class="flex items-center gap-1.5 text-[11px] mute"><span id="connDot" class="w-2 h-2 rounded-full bg-red-500"></span><span id="connText"></span></div></div>
    </div>
    <div class="lang flex chip !p-1"><button id="langEn" class="on">EN</button><button id="langAm">አማ</button></div>
    <div id="authBits" class="hidden items-center gap-2 flex-wrap">
      <span id="whoami" class="chip text-xs mute"></span>
      <div class="chip flex items-center gap-1.5"><span class="mute text-xs" data-i18n="wallet"></span><b id="wallet" class="gold tabular-nums text-base">0.00</b><span class="mute text-xs" data-i18n="etb"></span></div>
      <button id="depositBtn" class="cta !py-2 text-sm" data-i18n="deposit"></button>
      <button id="logoutBtn" class="chip text-xs font-bold" data-i18n="logout"></button>
    </div>
  </div>
</header>

<div id="login" class="fixed inset-0 z-[25] hidden items-start justify-center p-4 pt-28" style="background:rgba(11,13,18,.94);backdrop-filter:blur(8px)">
  <div class="tk w-full max-w-sm p-6 space-y-4">
    <h2 class="disp text-3xl font-extrabold" data-i18n="loginTitle"></h2>
    <p class="text-sm mute" data-i18n="loginSub"></p>
    <div id="stepPhone" class="space-y-3">
      <input id="phoneIn" type="tel" inputmode="tel" autocomplete="tel" data-ph="phPhone" class="inp w-full">
      <button id="sendBtn" class="cta w-full py-3" data-i18n="sendCode"></button>
    </div>
    <div id="stepCode" class="hidden space-y-3">
      <p id="codeMsg" class="text-sm mute"></p>
      <input id="codeIn" inputmode="numeric" maxlength="8" autocomplete="one-time-code" class="inp w-full text-center text-2xl tracking-[.4em]">
      <button id="verifyBtn2" class="cta w-full py-3" data-i18n="verifyLogin"></button>
      <button id="backBtn" class="text-xs mute underline w-full" data-i18n="changeNumber"></button>
    </div>
    <p id="loginErr" class="hidden text-sm text-rose-400"></p>
  </div>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-24 z-50 hidden px-4 py-2.5 rounded-2xl text-sm font-bold shadow-2xl max-w-[92vw] text-center"></div>

<section class="max-w-6xl mx-auto px-3 pt-7 pb-2">
  <h1 class="disp text-3xl sm:text-5xl font-extrabold leading-tight max-w-2xl" data-i18n="tag"></h1>
  <div class="mt-4 flex flex-wrap gap-x-7 gap-y-2">
    <div class="step"><span>1</span><i class="not-italic" data-i18n="how1"></i></div>
    <div class="step"><span>2</span><i class="not-italic" data-i18n="how2"></i></div>
    <div class="step"><span>3</span><i class="not-italic" data-i18n="how3"></i></div>
  </div>
</section>

<main class="max-w-6xl mx-auto px-3 py-5">
  <div id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
  <p id="empty" class="text-center mute py-16" data-i18n="waiting"></p>
</main>
<footer class="text-center text-xs mute pb-8" data-i18n="responsible"></footer>

    $('loginErr').classList.add('hidden'); $('verifyBtn2').disabled = true;
    try {
      const res = await fetch(`${API}/api/auth/verify-otp`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone_number: loginPhone, code }) });
      const data = await res.json();
      if (!res.ok) throw new Error(errText(data));
      token = data.token;
      try { localStorage.setItem('lub_token', token); } catch (e) {}
      enterApp(data.user);
    } catch (e) { loginError(e instanceof TypeError ? t('noApi') : e.message); }
    finally { $('verifyBtn2').disabled = false; }
  });

  // ---------- wallet top-up (Chapa when configured, mock in dev otherwise)
  let chapaOn = false;
  async function loadPayConfig() { try { chapaOn = !!(await (await fetch(`${API}/api/payments/config`)).json()).chapa; } catch (e) {} }

  $('depositBtn').addEventListener('click', async () => {
    if (!token) return toast(t('sessionExpired'), 'yellow');
    const amount = parseFloat(prompt(t('depPrompt'), '500'));
    if (!(amount > 0)) return;
    try {
      const res = await api(chapaOn ? '/api/wallet/deposit/initiate' : '/api/wallet/deposit', {
        method: 'POST', body: JSON.stringify(chapaOn ? { amount } : { amount, provider: 'mock' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(errText(data));
      if (chapaOn) { toast(t('depRedirect'), 'blue'); location.href = data.checkout_url; return; }
      setWallet(data.balance); toast(t('deposited', { n: fmt(amount) }), 'green');
    } catch (e) { toast(e instanceof TypeError ? t('noApi') : e.message, 'red'); }
  });

  async function checkReturn() {
    const ref = new URLSearchParams(location.search).get('deposit');
    if (!ref) return;
    history.replaceState(null, '', location.pathname);
    toast(t('depChecking'), 'blue');
    for (let i = 0; i < 30; i++) {
      try {
        const r = await api(`/api/wallet/deposit/status/${encodeURIComponent(ref)}`);
        const d = await r.json();
        if (r.ok && d.status === 'success') { setWallet(d.balance); return toast(t('depOk', { n: fmt(d.amount) }), 'green'); }
        if (r.ok && d.status !== 'pending') return toast(t('depFail'), 'red');
      } catch (e) { if (!token) return; }
      await new Promise((ok) => setTimeout(ok, 2000));
    }
    toast(t('depPending'), 'yellow');
  }

  // ---------- language switch
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('lang', l); } catch (e) {}
    document.documentElement.lang = l === 'am' ? 'am' : 'en';
    $('langEn').classList.toggle('on', l === 'en'); $('langAm').classList.toggle('on', l === 'am');
    applyI18n(document);
    $('connText').textContent = t(connKey);
    Object.values(auctions).forEach(upsertAuction);
    Object.entries(lastStatus).forEach(([id, s]) => showStatus(id, s, true));
  }
  $('langEn').addEventListener('click', () => setLang('en'));
  $('langAm').addEventListener('click', () => setLang('am'));

  setLang(lang);
  setConn(false, 'connecting');
  loadPayConfig();
  showLogin(!token);
  if (!token) connect();
  else api('/api/me').then(async (r) => { if (!r.ok) throw new Error(); enterApp(await r.json()); })
    .catch(() => { if (token) { toast(t('noApi'), 'red'); connect(); } });
})();
</script>
</body>
</html>
