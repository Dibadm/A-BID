services:
  # Web service (FastAPI + WebSocket + timer loop in background)
  - type: web
    name: lowbid-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && python -c "
import asyncio
import main
import uvicorn
import threading

# Start timer loop in background thread
def run_timer():
    asyncio.run(main.timer_loop())
threading.Thread(target=run_timer, daemon=True).start()

# Start FastAPI
uvicorn.run('main:app', host='0.0.0.0', port=8000)
"
    plan: free
    region: frankfurt
    healthCheckPath: /api/auctions
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lowbid-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: lowbid-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.0"
    autoDeploy: true

databases:
  - name: lowbid-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

  - name: lowbid-redis
    plan: free
    region: frankfurt